<script>
var FORM_TARGET = "{target}";
var CONTACT_EMAIL = "{email}";

document.getElementById('contact-form').addEventListener('submit', function (e) {
  e.preventDefault();
  var form = e.target, status = document.getElementById('form-status');
  if (form.dataset.sending) return;
  var data = new FormData(form);
  var practice = data.getAll('practice');
  data.delete('practice');
  if (practice.length) data.append('practice', practice.join(', '));
  if (/^https?:\/\//.test(FORM_TARGET)) {
    form.dataset.sending = '1';
    form.setAttribute('aria-busy', 'true');
    status.textContent = 'Sending…';
    fetch(FORM_TARGET, { method: 'POST', body: data, headers: { 'Accept': 'application/json' } })
      .then(function (r) {
        if (!r.ok) throw new Error();
        form.reset();
        status.textContent = "Thank you. You'll hear back within two business days, and nothing you've shared goes to anyone else without an NDA.";
      })
      .catch(function () {
        status.textContent = "Something went wrong and your message wasn't sent. Please try again, or email " + CONTACT_EMAIL + ".";
      })
      .then(function () {
        delete form.dataset.sending;
        form.removeAttribute('aria-busy');
      });
    return;
  }
  if (/^[^\s@\[\]:]+@[^\s@\[\]]+$/.test(FORM_TARGET)) {
    var lines = [];
    data.forEach(function (v, k) { if (v) lines.push(k + ': ' + v); });
    status.textContent = "Your email app should now open with your message. Press send there, and you'll hear back within two business days. Nothing you share goes to anyone else without an NDA. If no email app opens, write to " + FORM_TARGET + ".";
    window.location.href = 'mailto:' + FORM_TARGET + '?subject=' +
      encodeURIComponent('Confidential inquiry: ' + (data.get('firm') || data.get('name'))) +
      '&body=' + encodeURIComponent(lines.join('\r\n'));
    return;
  }
  status.textContent = "This form isn't connected yet, so your message wasn't sent.";
});
</script>
