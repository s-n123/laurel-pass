<script>
// Set FORM_TARGET in _build/build.py: a form endpoint URL (e.g. Formspree) or an inbox address.
var FORM_TARGET = "{target}";

document.getElementById('contact-form').addEventListener('submit', function (e) {
  e.preventDefault();
  var form = e.target, status = document.getElementById('form-status');
  var data = new FormData(form);
  if (/^https?:\/\//.test(FORM_TARGET)) {
    status.textContent = 'Sending…';
    fetch(FORM_TARGET, { method: 'POST', body: data, headers: { 'Accept': 'application/json' } })
      .then(function (r) {
        if (!r.ok) throw new Error();
        form.reset();
        status.textContent = "Thank you. You'll hear back within two business days, and nothing you've shared goes to anyone without an NDA.";
      })
      .catch(function () {
        status.textContent = "Something went wrong and your message wasn't sent. Please try again.";
      });
    return;
  }
  if (/^[^\s@\[\]]+@[^\s@\[\]]+$/.test(FORM_TARGET)) {
    var lines = [];
    data.forEach(function (v, k) { if (v) lines.push(k + ': ' + v); });
    status.textContent = "Your email app should open with this message. You'll hear back within two business days.";
    window.location.href = 'mailto:' + FORM_TARGET + '?subject=' +
      encodeURIComponent('Confidential inquiry: ' + (data.get('firm') || data.get('name'))) +
      '&body=' + encodeURIComponent(lines.join('\n'));
    return;
  }
  status.textContent = "This form isn't connected yet, so your message wasn't sent.";
});
</script>
